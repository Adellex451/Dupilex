<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dupilex | IGCSE Year 10 Revision</title>
<style>
:root{--bg:#0d0a16;--panel:#1b152a;--purple:#9b70ff;--pink:#d477ff;--text:#f7f3ff;--muted:#b2a9c2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#48246b66,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 5%;background:#100c1bf0;border-bottom:1px solid #ffffff20;flex-wrap:wrap}.brand{font-size:26px;font-weight:1000;letter-spacing:-1px;background:linear-gradient(90deg,#c7a7ff,#a16cff,#ed9dff);background-clip:text;color:transparent}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;font-size:12px}nav button.active,nav button:hover{background:#9b70ff30;color:white}.btn{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,#8555e8,#b06cf3);font-weight:800}.alt{background:#ffffff10;border:1px solid #ffffff25}main{max-width:1250px;margin:auto;padding:27px 5% 55px}.hero{padding:38px;min-height:320px;border:1px solid #b18bff44;border-radius:22px;background:radial-gradient(circle at 85% 40%,#a15ff955,transparent 28%),linear-gradient(120deg,#281a40,#171126 70%,#302047);position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:9%;top:8px;font-size:220px;color:#d5b7ff18}.heroText{position:relative;z-index:1;max-width:650px}.eyebrow{font-size:10px;letter-spacing:2px;color:#c8aaff;font-weight:900}.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.03;margin:13px 0}.grad{background:linear-gradient(90deg,#c9aaff,#a778ff,#eea6ff);background-clip:text;color:transparent}p{color:#c1b8d0;line-height:1.65;font-size:14px}.section{margin-top:34px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px;flex-wrap:wrap}h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:12px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.detail{background:linear-gradient(145deg,#211a35,#151020);border:1px solid #ffffff1c;border-radius:15px;padding:17px}.card:hover{border-color:#a77cff88;transform:translateY(-2px)}.card{transition:.2s}.ico{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#8153d9,#402b65);font-size:21px;margin-bottom:12px}.card h3{font-size:15px;margin:0 0 6px}.card p{font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#a77cff25;color:#d6c5ff;font-size:10px;margin:3px}.searchbar{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}input,select{background:#1b1529;border:1px solid #ffffff30;border-radius:10px;padding:12px;color:white}input{flex:1;min-width:190px}.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid #ffffff20;padding:13px;border-radius:12px;margin:9px 0}.grow{flex:1}.row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{padding:14px;border-radius:13px;background:#ffffff0b;border:1px solid #ffffff20}.stat b{font-size:25px;color:#c7a7ff;display:block}.stat span{font-size:11px;color:var(--muted)}.detail{margin-top:17px;padding:22px}.detail h4{color:#d6c2ff;margin:20px 0 5px}.quizopt{display:block;text-align:left;width:100%;padding:12px;margin:8px 0;background:#ffffff0b;border:1px solid #ffffff25;border-radius:10px}.quizopt.correct{border-color:#73ddb1;background:#73ddb11a}.quizopt.wrong{border-color:#ff7e9c;background:#ff7e9c15}.feedback{padding:12px;background:#ffffff0c;border-radius:10px;margin-top:12px;font-size:13px}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border-radius:13px;grid-column:1/-1}.video{display:flex;gap:12px;align-items:center}.play{width:55px;height:55px;display:grid;place-items:center;background:linear-gradient(140deg,#8658e5,#d477ff);border-radius:12px;font-size:22px}footer{text-align:center;padding:25px;border-top:1px solid #ffffff20;color:#887e99;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#07050ddd;z-index:10;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(450px,100%);padding:23px;background:#211832;border:1px solid #ffffff30;border-radius:17px;position:relative}.modalbox input{width:100%;margin:10px 0}.close{position:absolute;right:12px;top:12px;background:#ffffff15;border:0;border-radius:50%;padding:7px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302247;border:1px solid #a77cff;padding:12px 17px;border-radius:20px;z-index:15;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header nav{order:3;width:100%;overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.hero{padding:25px}.hero:after{right:-35px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">DUPILEX</div><nav><button class="active" data-page="home">Home</button><button data-page="subjects">Subjects</button><button data-page="notes">Revision notes</button><button data-page="quizzes">Quizzes</button><button data-page="guides">Study guides</button><button data-page="videos">Video guides</button><button data-page="resources">Resources</button></nav><button class="btn" id="account">Sign in</button></header>
<main id="app"></main><footer>DUPILEX · Learn with purpose. Revise with confidence.<br><br>Independent revision resource. Cambridge and IGCSE are trademarks of their respective owners. Check your current syllabus and exam session.</footer>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const subjects=[
['biology','Biology','0610','🧬','Cells, organisation, genetics, ecology and human biology.','Cell structure|Movement in and out of cells|Enzymes|Nutrition|Transport in plants|Transport in humans|Respiration|Inheritance|Ecology'],
['chemistry','Chemistry','0620','⚗️','Atoms, bonding, formulae, reactions, acids and organic chemistry.','States of matter|Atoms and elements|Bonding|Formulae and equations|Acids and bases|Rates of reaction|Electrolysis|Organic chemistry'],
['physics','Physics','0625','⚡','Motion, forces, energy, waves, electricity and space physics.','Motion|Forces|Energy|Thermal physics|Waves|Electricity|Magnetism|Nuclear physics'],
['maths','Mathematics','0580','📐','Number, algebra, geometry, mensuration, statistics and probability.','Number|Algebra|Graphs|Geometry|Mensuration|Trigonometry|Vectors|Statistics|Probability'],
['english','English Language','0500','📚','Reading comprehension, writer’s effects, summary and composition.','Comprehension|Writer’s effect|Summary writing|Directed writing|Descriptive writing|Narrative writing'],
['computer','Computer Science','0478','💻','Data representation, hardware, networks, security and algorithms.','Data representation|Data transmission|Hardware|Software|The internet|Security|Algorithms|Programming'],
['ict','Information and Communication Technology','0417','🖥️','Computer systems, documents, databases, spreadsheets and web authoring.','Computer systems|Input and output devices|Networks|File management|Spreadsheets|Databases|Web authoring'],
['history','History','0470','🏛️','Historical events, causes, consequences, interpretations and source skills.','Treaty of Versailles|League of Nations|Rise of dictatorships|International relations|Source analysis'],
['geography','Geography','0460','🌍','Physical environments, human environments, development and fieldwork.','Population|Settlement|Natural hazards|Rivers|Coasts|Weather and climate|Economic development'],
['literature','Literature in English','0475','✒️','Poetry, prose and drama: language, structure, character and themes.','Poetry analysis|Prose analysis|Drama analysis|Characterisation|Themes|Essay structure']];
const notes=[
['biology','Cell structure','Cells are the basic structural and functional units of living organisms. Plant and animal cells are eukaryotic because they contain a nucleus and membrane-bound organelles.',[['Nucleus','Contains genetic material (DNA) and controls cell activities.'],['Cytoplasm','Where many chemical reactions take place.'],['Cell membrane','Controls movement of substances into and out of the cell.'],['Mitochondria','Main site of aerobic respiration.'],['Ribosomes','Site of protein synthesis.'],['Cell wall','In plant cells, made mainly of cellulose; supports and strengthens the cell.'],['Chloroplasts','Contain chlorophyll and are the site of photosynthesis.'],['Permanent vacuole','Contains cell sap and helps maintain turgor.']]],
['chemistry','Atomic structure','An atom contains a tiny, dense nucleus surrounded by electrons. The nucleus contains protons and neutrons.',[['Proton','Relative charge +1; relative mass 1.'],['Neutron','Relative charge 0; relative mass 1.'],['Electron','Relative charge −1; relative mass about 1/1836.'],['Proton number','The number of protons; identifies the element.'],['Mass number','Total number of protons and neutrons.']]],
['physics','Speed, distance and time','Average speed is the distance travelled divided by the time taken.',[['Formula','speed = distance ÷ time'],['Rearrangement','distance = speed × time; time = distance ÷ speed'],['Units','Use consistent units, such as metres, seconds and metres per second.'],['Distance–time graph','The gradient represents speed; a horizontal line means stationary.']]],
['maths','Limits of accuracy','A rounded measurement represents a range of possible values. Bounds are the smallest and largest values that would round to the stated measurement.',[['Lower bound','For a value rounded to the nearest whole number, subtract 0.5.'],['Upper bound','Add 0.5; the upper bound is not included.'],['Example','12 cm to the nearest cm means 11.5 ≤ length < 12.5 cm.'],['Exam tip','Use the appropriate bounds to find minimum or maximum results.']]],
['computer','Fetch–decode–execute cycle','The CPU repeatedly processes instructions using the fetch–decode–execute cycle. The control unit coordinates the stages.',[['Fetch','The program counter address is copied to the memory address register. The instruction is fetched into the memory data register, then copied to the current instruction register.'],['Decode','The control unit interprets the instruction and determines the required action.'],['Execute','The CPU carries out the instruction, using the ALU, registers or memory as needed.'],['Program counter','Holds the address of the next instruction.']]],
['english','Building an analytical paragraph','A strong analysis paragraph makes a clear point, supports it with evidence and explains the effect on the reader.',[['Point','Make one clear argument about the writer’s method or idea.'],['Evidence','Use a short, relevant quotation or precise textual reference.'],['Explanation','Analyse a specific word, image or structural choice and its effect.'],['Link','Connect your analysis back to the question and writer’s purpose.']]],
['history','Treaty of Versailles: key ideas','The Treaty of Versailles was signed in 1919 after the First World War. It imposed terms on Germany and aimed to establish a post-war settlement.',[['War guilt','Article 231 placed responsibility for war damage on Germany and its allies.'],['Reparations','Germany was required to pay compensation.'],['Military restrictions','Germany’s armed forces and weapons were restricted.'],['Territorial changes','Germany lost territory and its overseas colonies.'],['Evaluation','The treaty created resentment in Germany, although historians debate how far it directly caused later events.']]]];
const quiz=[['Which organelle is the main site of aerobic respiration?',['Ribosome','Mitochondrion','Cell wall','Nucleus'],1,'Mitochondria are the main site of aerobic respiration in eukaryotic cells.'],['What is the proton number?',['Protons plus neutrons','Number of electron shells','Number of protons','Number of neutrons'],2,'The proton number is the number of protons in the nucleus.'],['A runner travels 100 m in 20 s. Average speed?',['2 m/s','5 m/s','20 m/s','2000 m/s'],1,'Speed = distance ÷ time = 100 ÷ 20 = 5 m/s.'],['A length is 8 cm to the nearest cm. What is its lower bound?',['7 cm','7.5 cm','8.5 cm','9 cm'],1,'Subtract half of 1 cm: 8 − 0.5 = 7.5 cm.'],['Which CPU component decodes instructions?',['Control unit','Monitor','Hard disk','Input unit'],0,'The control unit decodes instructions and coordinates CPU operations.'],['Which paragraph feature explains how evidence supports your point?',['A title','Explanation','A bibliography','A heading'],1,'Explanation analyses evidence and links it to the argument.']];
const resources=[['Cambridge International','Official syllabus and subject information','https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-igcse/'],['Cambridge teacher support','Support and training resources','https://www.cambridgeinternational.org/support-and-training-for-schools/'],['BBC Bitesize','Accessible revision explanations and activities','https://www.bbc.co.uk/bitesize'],['Physics & Maths Tutor','Revision notes and practice resources','https://www.physicsandmathstutor.com/']];
let page='home',user=localStorage.getItem('du_user')||'',qi=0,score=0,answered=false,term='',filter='All';const $=x=>document.getElementById(x),app=$('app');
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}
function go(p){page=p;render();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));scrollTo({top:0,behavior:'smooth'})}
function subCard(s){return `<article class="card"><div class="ico">${s[3]}</div><h3>${s[1]}</h3><span class="pill">Cambridge ${s[2]}</span><p>${s[4]}</p><button class="btn alt" data-sub="${s[0]}">Explore subject →</button></article>`}
function noteCard(n){let s=subjects.find(x=>x[0]===n[0]);return `<article class="card"><span class="pill">${s[1]}</span><h3 style="margin-top:10px">${n[1]}</h3><p>${n[2].slice(0,120)}…</p><button class="btn alt" data-note="${notes.indexOf(n)}">Read notes →</button></article>`}
function showNote(i){let n=notes[+i],s=subjects.find(x=>x[0]===n[0]);app.innerHTML=`<button class="btn alt" data-page="notes">← All notes</button><div class="detail"><div class="eyebrow">${s[1]} · ${s[2]}</div><h1>${n[1]}</h1><p>${n[2]}</p>${n[3].map(x=>`<h4>${x[0]}</h4><p>${x[1]}</p>`).join('')}<p><b>Revision reminder:</b> Learn key terms, practise applying them and check your current syllabus.</p></div>`}
function showSub(k){let s=subjects.find(x=>x[0]===k),ns=notes.filter(n=>n[0]===k);app.innerHTML=`<button class="btn alt" data-page="subjects">← All subjects</button><div class="detail"><div class="eyebrow">CAMBRIDGE IGCSE · ${s[2]}</div><h1>${s[3]} ${s[1]}</h1><p>${s[4]}</p><h3>Topic overview</h3><div>${s[5].split('|').map(t=>`<span class="pill">${t}</span>`).join('')}</div><h3 style="margin-top:25px">Available revision notes</h3>${ns.length?ns.map(n=>`<div class="row"><div class="grow"><b>${n[1]}</b><small>Starter revision notes</small></div><button class="btn" data-note="${notes.indexOf(n)}">Open</button></div>`).join(''):'<p>More topic-by-topic notes are being prepared for this subject.</p>'}</div>`}
function render(){
if(page==='home')app.innerHTML=`<section class="hero"><div class="heroText"><div class="eyebrow">✦ CAMBRIDGE IGCSE · YEAR 10</div><h1>STUDY SMARTER.<br><span class="grad">GO FURTHER.</span></h1><p>Your revision space for clear notes, quick quizzes and useful study resources. Build confidence one topic at a time.</p><button class="btn" data-page="subjects">Explore subjects ↗</button> <button class="btn alt" data-page="quizzes">Try a quiz</button><div class="stats"><div class="stat"><b>10</b><span>Subject areas</span></div><div class="stat"><b>${notes.length}</b><span>Starter note sets</span></div><div class="stat"><b>${quiz.length}</b><span>Quiz questions</span></div></div></div></section><section class="section"><div class="head"><div><h2>Explore subjects</h2><div class="muted">Choose a subject to view topics and notes.</div></div><button class="btn alt" data-page="subjects">All subjects →</button></div><div class="grid">${subjects.slice(0,6).map(subCard).join('')}</div></section><section class="section"><div class="head"><h2>Featured revision notes</h2><button class="btn alt" data-page="notes">All notes →</button></div><div class="grid">${notes.slice(0,3).map(noteCard).join('')}</div></section><section class="section"><h2>Make revision active</h2><div class="grid" style="margin-top:14px"><article class="card"><div class="ico">🧠</div><h3>Test your knowledge</h3><p>Answer quick questions and read explanations.</p><button class="btn" data-page="quizzes">Start quiz</button></article><article class="card"><div class="ico">🗺️</div><h3>Plan your study</h3><p>Use structured guides to organise revision.</p><button class="btn" data-page="guides">Study guides</button></article><article class="card"><div class="ico">▶</div><h3>Learn visually</h3><p>Find video explanations and worked examples.</p><button class="btn" data-page="videos">Video guides</button></article></div></section>`;
if(page==='subjects')app.innerHTML=`<div class="eyebrow">YOUR IGCSE SUBJECT LIBRARY</div><h1>All <span class="grad">subjects.</span></h1><p>Browse Cambridge subject codes and topic areas.</p><div class="searchbar"><input id="subSearch" placeholder="Search subjects or topics..." value="${term}"></div><div class="grid">${subjects.filter(s=>(s[1]+' '+s[2]+' '+s[5]).toLowerCase().includes(term.toLowerCase())).map(subCard).join('')||'<div class="empty">No subjects found.</div>'}</div>`;
if(page==='notes')app.innerHTML=`<div class="eyebrow">REVISION LIBRARY</div><h1>Clear notes. <span class="grad">Better recall.</span></h1><p>Starter notes with definitions, explanations and exam reminders.</p><div class="searchbar"><input id="noteSearch" placeholder="Search notes or subjects..." value="${term}"><select id="noteFilter"><option value="All">All subjects</option>${subjects.map(s=>`<option value="${s[0]}" ${filter===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div class="grid">${notes.filter(n=>(filter==='All'||filter===n[0])&&(n[1]+' '+n[2]+' '+subjects.find(s=>s[0]===n[0])[1]).toLowerCase().includes(term.toLowerCase())).map(noteCard).join('')||'<div class="empty">No notes match your search.</div>'}</div>`;
if(page==='quizzes')app.innerHTML=`<div class="eyebrow">QUICK KNOWLEDGE CHECK</div><h1>Revision <span class="grad">quiz.</span></h1><p>Choose an answer, then read the explanation.</p><div class="detail" id="quizbox"><div class="muted">Question ${qi+1} of ${quiz.length} · Score ${score}</div><h2 style="margin:15px 0">${quiz[qi][0]}</h2><div>${quiz[qi][1].map((o,i)=>`<button class="quizopt" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback"></div><button class="btn" id="next" style="display:none;margin-top:14px">${qi===quiz.length-1?'See results':'Next question →'}</button><button class="btn alt" id="restart" style="margin:14px 0 0 8px">Restart</button></div>`;
if(page==='guides')app.innerHTML=`<div class="eyebrow">STUDY SKILLS</div><h1>Study <span class="grad">guides.</span></h1><p>Simple routines to make revision more organised and effective.</p><div class="grid">${[['🗓️','Weekly revision plan','List subjects and upcoming assessments. Break each subject into small topics. Schedule focused sessions with breaks. Leave time for practice questions and review.'],['🧠','Active recall','Read a small section, close your notes, then write or say what you remember. Check gaps and revisit them later rather than simply rereading.'],['🔁','Spaced practice','Return to topics after increasing gaps: the next day, a few days later and a week later. Mix older topics into new revision.'],['✍️','Exam question practice','Check command words, show working in calculations, use subject vocabulary and compare your response with a mark scheme when available.'],['🎯','Set a session goal','Make goals specific: “Explain the role of the control unit” is more useful than “revise Computer Science”.'],['🌙','Finish with a recap','List what you learned, what remains confusing and the first task for your next session.']].map(x=>`<article class="card"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div>`;
if(page==='videos')app.innerHTML=`<div class="eyebrow">WATCH AND LEARN</div><h1>Video <span class="grad">guides.</span></h1><p>Open targeted YouTube searches for explanations. Choose videos that match your syllabus and exam session.</p><div class="grid">${subjects.slice(0,8).map(s=>`<article class="card video"><div class="play">▶</div><div class="grow"><h3>${s[1]}</h3><p>Cambridge IGCSE ${s[1]} revision explanations.</p><a class="pill" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent('Cambridge IGCSE '+s[1]+' revision')}">Search videos ↗</a></div></article>`).join('')}</div><p class="muted">Dupilex does not host or own these videos.</p>`;
if(page==='resources')app.innerHTML=`<div class="eyebrow">TRUSTED STUDY LINKS</div><h1>Study <span class="grad">resources.</span></h1><p>Useful starting points for syllabus checks, explanations and revision practice.</p><div class="grid">${resources.map(r=>`<article class="card"><div class="ico">↗</div><h3>${r[0]}</h3><p>${r[1]}</p><a class="btn alt" href="${r[2]}" target="_blank" rel="noopener">Open resource ↗</a></article>`).join('')}</div><div class="detail"><h3>Syllabus reminder</h3><p>Cambridge syllabuses and topic coverage can change between exam years. Check the syllabus code and examination session set by your school. Dupilex is an independent revision project, not an official Cambridge resource.</p></div>`;
}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]'),s=e.target.closest('[data-sub]'),n=e.target.closest('[data-note]'),a=e.target.closest('[data-answer]');if(p)go(p.dataset.page);if(s)showSub(s.dataset.sub);if(n)showNote(n.dataset.note);if(a)answer(+a.dataset.answer)});
document.addEventListener('input',e=>{if(e.target.id==='subSearch'||e.target.id==='noteSearch'){term=e.target.value;let id=e.target.id,pos=e.target.selectionStart;render();let el=$(id);if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='noteFilter'){filter=e.target.value;render()}});
function answer(i){if(answered)return;answered=true;let q=quiz[qi];document.querySelectorAll('[data-answer]').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===i&&i!==q[2])b.classList.add('wrong')});if(i===q[2])score++;$('feedback').innerHTML=`<div class="feedback"><b>${i===q[2]?'Correct! ✨':'Not quite.'}</b> ${q[3]}</div>`;$('next').style.display='inline-block'}
document.addEventListener('click',e=>{if(e.target.id==='next'){if(qi<quiz.length-1){qi++;answered=false;render()}else{$('quizbox').innerHTML=`<div class="eyebrow">QUIZ COMPLETE</div><h2>You scored ${score} / ${quiz.length}</h2><p>${score>=5?'Excellent work!':score>=3?'Good effort. Review explanations for anything missed.':'Keep practising. Revisit the notes and try again.'}</p><button class="btn" id="restart">Try again</button>`}}if(e.target.id==='restart'){qi=0;score=0;answered=false;render()}});
$('account').onclick=()=>{if(user){if(confirm('Sign out of this browser profile?')){user='';localStorage.removeItem('du_user');$('account').textContent='Sign in';toast('Signed out')}}else{$('modalbox').innerHTML=`<button class="close" id="close">✕</button><div class="eyebrow">YOUR DUPILEX PROFILE</div><h2>Welcome to Dupilex</h2><p>Choose a display name for this browser demo. This is not a secure online account.</p><input id="displayName" maxlength="28" placeholder="Your display name"><button class="btn" id="join">Continue</button>`;$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('join').onclick=()=>{let v=$('displayName').value.trim();if(!v)return toast('Enter a display name');user=v;localStorage.setItem('du_user',v);$('account').textContent='Hi, '+v;$('modal').classList.remove('show');toast('Profile saved on this browser')}}};
if(user)$('account').textContent='Hi, '+user;render();
</script></body></html>
